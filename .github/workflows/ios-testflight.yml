name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'App Store Connect(TestFlight)에 업로드 (끄면 서명·검증된 IPA만 생성)'
        type: boolean
        default: false
      what_to_test:
        description: 'TestFlight "테스트할 내용" 문구 (실행 Summary에 표시, App Store Connect에는 직접 붙여 넣음)'
        type: string
        default: '첫 실행에서 "가상 eTL로 테스트하기"를 고르고 본인 ChatGPT 계정으로 로그인한 뒤 과제 조회·강의자료 요약·일정 추가 승인과 취소를 확인해 주세요.'
  pull_request:
    paths:
      - '.github/workflows/ios-testflight.yml'
      - '.github/scripts/ios-firebase-distribute.py'
      - '.github/scripts/check-ios-private-apis.py'
      - 'scripts/test-ios-firebase.py'
      - 'ios/Youngmin.xcodeproj/project.pbxproj'
      - 'ios/Youngmin/Info.plist'
      - 'ios/*/PrivacyInfo.xcprivacy'
permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test distribution validation without credentials
        run: python3 -I scripts/test-ios-firebase.py
      - name: Check runtime sources for the removed private API
        run: python3 -I .github/scripts/check-ios-private-apis.py
      - name: Check required TestFlight settings before allocating a Mac
        if: github.event_name == 'workflow_dispatch'
        env:
          UPLOAD_TO_APP_STORE_CONNECT: ${{ inputs.upload }}
          IOS_TESTFLIGHT_BUILD_OFFSET: ${{ vars.IOS_TESTFLIGHT_BUILD_OFFSET }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_APP_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_APP_PROFILE_BASE64 }}
          IOS_APPSTORE_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_WIDGETS_PROFILE_BASE64 }}
          IOS_APPSTORE_SHARE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_SHARE_PROFILE_BASE64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 -I .github/scripts/ios-firebase-distribute.py check --distribution app-store
      - name: Verify P12 password before allocating a Mac
        if: github.event_name == 'workflow_dispatch'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: python3 -I .github/scripts/ios-firebase-distribute.py check-p12

  build-and-upload:
    if: github.event_name == 'workflow_dispatch'
    needs: distribution-checks
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      UPLOAD_TO_APP_STORE_CONNECT: ${{ inputs.upload }}
      IOS_TESTFLIGHT_BUILD_OFFSET: ${{ vars.IOS_TESTFLIGHT_BUILD_OFFSET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check settings before compiling native dependencies
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_APP_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_APP_PROFILE_BASE64 }}
          IOS_APPSTORE_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_WIDGETS_PROFILE_BASE64 }}
          IOS_APPSTORE_SHARE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_SHARE_PROFILE_BASE64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -I .github/scripts/ios-firebase-distribute.py check --distribution app-store
          python3 -I .github/scripts/ios-firebase-distribute.py check-signing --distribution app-store
      # Native build steps are copied verbatim from ios-firebase.yml so both share one cache.
      - name: Restore native Rust dependencies
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-distribution-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-ios-codex.py', '.github/scripts/ios-codex-probe.sh', 'ios/NativeCodex/bridge/**', 'ios/NativeCodex/javascript/**', 'ios/NativeCodex/native-static-libs.txt') }}
          restore-keys: ios-codex-170-distribution-${{ runner.arch }}-
      - name: Build the embedded official Codex library
        env:
          CODEX_PROBE_COMPONENT: bridge
          CODEX_PROBE_OPERATION: build
          # Reuse only a completed library with the exact source key and build flags.
          CODEX_REUSE_COMPILED_LIBRARY: 'true'
          CODEX_NATIVE_CACHE_KEY: ${{ steps.native-cache.outputs.cache-primary-key }}-o1-debug0-noassert-nooverflow
          # Reuse the proven dev-small compilation profile, without dev assertions.
          CARGO_PROFILE_DEV_SMALL_DEBUG: '0'
          CARGO_PROFILE_DEV_SMALL_DEBUG_ASSERTIONS: 'false'
          CARGO_PROFILE_DEV_SMALL_OVERFLOW_CHECKS: 'false'
        run: bash .github/scripts/ios-codex-probe.sh
      - name: Save native compilation cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-distribution-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-ios-codex.py', '.github/scripts/ios-codex-probe.sh', 'ios/NativeCodex/bridge/**', 'ios/NativeCodex/javascript/**', 'ios/NativeCodex/native-static-libs.txt') }}
      - name: Test Swift logic in Release configuration
        run: swift test --package-path ios/YoungminKit -c release
      - name: Archive, sign and verify Release App Store Connect IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_APP_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_APP_PROFILE_BASE64 }}
          IOS_APPSTORE_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_WIDGETS_PROFILE_BASE64 }}
          IOS_APPSTORE_SHARE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_SHARE_PROFILE_BASE64 }}
        run: python3 .github/scripts/ios-firebase-distribute.py build --distribution app-store
      - name: Save verified IPA and crash symbols
        uses: actions/upload-artifact@v7
        with:
          name: youngmin-appstore-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios-distribution-output/Youngmin-AppStore.ipa
            ios-distribution-output/Youngmin-AppStore.ipa.sha256
            ios-distribution-output/Youngmin-dSYMs.zip
            ios-distribution-output/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect for TestFlight
        if: inputs.upload
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: python3 .github/scripts/ios-firebase-distribute.py upload --distribution app-store
