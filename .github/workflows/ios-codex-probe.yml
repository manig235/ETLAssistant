name: iOS Codex Runtime Probe

on:
  workflow_dispatch:
    inputs:
      component:
        description: Official library or application bridge
        type: choice
        default: bridge
        options:
          - bridge
          - upstream
      runner:
        description: Mac runner (Intel also cross-compiles native arm64 iOS)
        type: choice
        default: macos-26-intel
        options:
          - macos-26-intel
          - macos-26

permissions:
  contents: read

concurrency:
  group: ios-codex-probe-${{ inputs.component }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-native-runtime:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache pinned Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-minimal-${{ runner.arch }}-ios-arm64-${{ hashFiles('.github/scripts/ios-codex-probe.sh', '.github/scripts/prepare-ios-codex.py', 'ios/NativeCodex/bridge/**') }}
          restore-keys: ios-codex-170-minimal-${{ runner.arch }}-ios-arm64-
      - name: Compile the official in-process app server for iOS
        env:
          CODEX_PROBE_COMPONENT: ${{ inputs.component }}
        run: bash .github/scripts/ios-codex-probe.sh
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-codex-probe-${{ github.run_attempt }}
          path: |
            ios-codex-probe/*.log
            ios-codex-probe/*.txt
            ios-codex-probe/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Save Rust dependencies even after a compile failure
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
