name: iOS Ad Hoc Firebase

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Firebase 테스터 그룹에 배포 (끄면 서명된 IPA만 생성)'
        type: boolean
        default: false
      release_notes:
        description: '테스터에게 전달할 변경 사항'
        type: string
        default: '지인 테스트'
  pull_request:
    paths:
      - '.github/workflows/ios-firebase.yml'
      - '.github/scripts/ios-firebase-distribute.py'
      - '.github/scripts/ios-codex-lib.py'
      - '.github/scripts/test-ios-codex-lib.py'
      - '.github/actions/ios-codex-lib/**'
      - 'scripts/test-ios-firebase.py'
      - 'ios/Youngmin.xcodeproj/project.pbxproj'

permissions:
  contents: read

concurrency:
  group: ios-firebase-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test distribution validation without credentials
        run: python3 scripts/test-ios-firebase.py
      - name: Test native library cache verification
        run: python3 .github/scripts/test-ios-codex-lib.py

  native-lib:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 5
    outputs:
      compiled: ${{ steps.lookup.outputs.hit }}
    env:
      PUBLISH_TO_FIREBASE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check settings before testing or compiling native dependencies
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python3 .github/scripts/ios-firebase-distribute.py check
      - name: Check whether this exact engine was already tested and built
        id: lookup
        continue-on-error: true
        uses: ./.github/actions/ios-codex-lib
        with:
          profile: release
          lookup-only: 'true'

  # Same gate as iOS Native Codex IPA: a new engine is built only after its
  # interpreter and Codex delegate tests pass; a cached one already passed them.
  javascript-runtime-tests:
    needs: native-lib
    if: needs.native-lib.outputs.compiled != 'true'
    uses: ./.github/workflows/ios-code-mode-probe.yml

  build-and-distribute:
    needs: [distribution-checks, native-lib, javascript-runtime-tests]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && needs.distribution-checks.result == 'success' && needs.native-lib.result == 'success' && (needs.javascript-runtime-tests.result == 'success' || needs.javascript-runtime-tests.result == 'skipped') }}
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      PUBLISH_TO_FIREBASE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check settings before compiling native dependencies
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python3 .github/scripts/ios-firebase-distribute.py check
      - name: Restore the exact native library or the shared compilation cache
        id: native-lib
        uses: ./.github/actions/ios-codex-lib
        with:
          # Shared with the optimized iOS Native Codex IPA: opt-level 1, no debug
          # info, no debug assertions or overflow checks (dev-small profile).
          profile: release
      - name: Build the embedded official Codex library
        id: native-engine
        if: steps.native-lib.outputs.hit != 'true'
        run: python3 .github/scripts/ios-codex-lib.py build --profile release --key '${{ steps.native-lib.outputs.key }}'
      - name: Save native library and compilation caches
        if: always() && steps.native-lib.outcome == 'success' && steps.native-lib.outputs.hit != 'true'
        uses: ./.github/actions/ios-codex-lib/save
        with:
          key: ${{ steps.native-lib.outputs.key }}
          build-key: ${{ steps.native-lib.outputs.build-key }}
          build-hit: ${{ steps.native-lib.outputs.build-hit }}
          compiled: ${{ steps.native-engine.outcome == 'success' }}
          publish-library: ${{ needs.javascript-runtime-tests.result == 'success' }}
      - name: Test Swift logic in Release configuration
        run: swift test --package-path ios/YoungminKit -c release
      - name: Archive, sign and verify Release Ad Hoc IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: python3 .github/scripts/ios-firebase-distribute.py build
      - name: Save verified IPA and crash symbols
        uses: actions/upload-artifact@v7
        with:
          name: youngmin-adhoc-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios-distribution-output/Youngmin-AdHoc.ipa
            ios-distribution-output/Youngmin-AdHoc.ipa.sha256
            ios-distribution-output/Youngmin-dSYMs.zip
            ios-distribution-output/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Set up Node for Firebase CLI
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Firebase CLI
        if: inputs.publish
        run: npm install --global firebase-tools@15.37.0
      - name: Distribute to the configured Firebase tester groups
        if: inputs.publish
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python3 .github/scripts/ios-firebase-distribute.py publish
