name: iOS Ad Hoc Firebase

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Firebase 테스터 그룹에 배포 (끄면 서명된 IPA만 생성)'
        type: boolean
        default: false
      release_notes:
        description: '테스터에게 전달할 변경 사항'
        type: string
        default: '지인 테스트'
  pull_request:
    paths:
      - '.github/workflows/ios-firebase.yml'
      - '.github/scripts/ios-firebase-distribute.py'
      - 'scripts/test-ios-firebase.py'
      - 'ios/Youngmin.xcodeproj/project.pbxproj'

permissions:
  contents: read

concurrency:
  group: ios-firebase-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test distribution validation without credentials
        run: python3 scripts/test-ios-firebase.py
      - name: Verify P12 password with OpenSSL before allocating a Mac
        if: github.event_name == 'workflow_dispatch'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: python3 .github/scripts/ios-firebase-distribute.py check-p12

  build-and-distribute:
    if: github.event_name == 'workflow_dispatch'
    needs: distribution-checks
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      PUBLISH_TO_FIREBASE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check settings before compiling native dependencies
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 .github/scripts/ios-firebase-distribute.py check
          python3 .github/scripts/ios-firebase-distribute.py check-signing
      - name: Restore native Rust dependencies
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-distribution-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-ios-codex.py', '.github/scripts/ios-codex-probe.sh', 'ios/NativeCodex/bridge/**', 'ios/NativeCodex/javascript/**', 'ios/NativeCodex/native-static-libs.txt') }}
          restore-keys: ios-codex-170-distribution-${{ runner.arch }}-
      - name: Build the embedded official Codex library
        env:
          CODEX_PROBE_COMPONENT: bridge
          CODEX_PROBE_OPERATION: build
          # Reuse only a completed library with the exact source key and build flags.
          CODEX_REUSE_COMPILED_LIBRARY: 'true'
          CODEX_NATIVE_CACHE_KEY: ${{ steps.native-cache.outputs.cache-primary-key }}-o1-debug0-noassert-nooverflow
          # Reuse the proven dev-small compilation profile, without dev assertions.
          CARGO_PROFILE_DEV_SMALL_DEBUG: '0'
          CARGO_PROFILE_DEV_SMALL_DEBUG_ASSERTIONS: 'false'
          CARGO_PROFILE_DEV_SMALL_OVERFLOW_CHECKS: 'false'
        run: bash .github/scripts/ios-codex-probe.sh
      - name: Save native compilation cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-distribution-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-ios-codex.py', '.github/scripts/ios-codex-probe.sh', 'ios/NativeCodex/bridge/**', 'ios/NativeCodex/javascript/**', 'ios/NativeCodex/native-static-libs.txt') }}
      - name: Test Swift logic in Release configuration
        run: swift test --package-path ios/YoungminKit -c release
      - name: Archive, sign and verify Release Ad Hoc IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: python3 .github/scripts/ios-firebase-distribute.py build
      - name: Save verified IPA and crash symbols
        uses: actions/upload-artifact@v7
        with:
          name: youngmin-adhoc-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios-distribution-output/Youngmin-AdHoc.ipa
            ios-distribution-output/Youngmin-AdHoc.ipa.sha256
            ios-distribution-output/Youngmin-dSYMs.zip
            ios-distribution-output/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Set up Node for Firebase CLI
        if: inputs.publish
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Firebase CLI
        if: inputs.publish
        run: npm install --global firebase-tools@15.37.0
      - name: Distribute to the configured Firebase tester groups
        if: inputs.publish
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python3 .github/scripts/ios-firebase-distribute.py publish
