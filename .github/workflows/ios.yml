name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, ios-port, 'codex/ios-*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test YoungminKit
        run: |
          set -o pipefail
          mkdir -p ios-test-results
          swift test --package-path ios/YoungminKit 2>&1 | tee ios-test-results/swift-test.log
      - name: Save logic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logic-tests-${{ github.run_attempt }}
          path: ios-test-results/
          retention-days: 7

  simulator-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run app UI tests on an iPhone simulator
        run: bash .github/scripts/ios-simulator.sh
      - name: Export UI screenshots and diagnostics
        if: always()
        run: |
          if [ -d ios-test-results/Youngmin.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path ios-test-results/Youngmin.xcresult \
              --output-path ios-test-results/attachments
          fi
      - name: Save simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-tests-${{ github.run_attempt }}
          path: ios-test-results/
          retention-days: 7
