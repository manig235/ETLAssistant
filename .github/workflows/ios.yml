name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, codex/ios-pr-review-fixes]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test YoungminKit
        working-directory: ios/YoungminKit
        run: swift test
      - name: Build app, widgets, and share extension
        working-directory: ios
        run: >-
          xcodebuild -project Youngmin.xcodeproj -scheme Youngmin
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/CI CODE_SIGNING_ALLOWED=NO build
      - name: Smoke test app launch
        working-directory: ios
        timeout-minutes: 5
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/CI/Build/Products/Debug-iphonesimulator/Youngmin.app
          launch_output=$(xcrun simctl launch "$device_id" kr.snu.etlassistant.ios)
          echo "$launch_output"
          app_pid=${launch_output##*: }
          sleep 5
          kill -0 "$app_pid"
