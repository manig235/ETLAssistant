name: iOS Native Codex IPA

on:
  workflow_dispatch:
    inputs:
      fast:
        description: 빠른 iPad 설치 테스트용 빌드
        type: boolean
        default: true
      runtime_proof_run:
        description: 동일 실행기 코드의 검증을 이미 통과한 실행 번호 (선택)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-native-codex-ipa-${{ inputs.fast && 'test' || 'optimized' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cache:
    runs-on: macos-26-intel
    timeout-minutes: 5
    outputs:
      compiled: ${{ steps.lookup.outputs.cache-hit }}
      runtime-verified: ${{ steps.proof.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check whether this exact engine was already tested and built
        id: lookup
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-minimal-${{ runner.arch }}-device-${{ inputs.fast && 'dev0' || 'dev1' }}-build-${{ hashFiles('.github/scripts/prepare-ios-codex.py', '.github/scripts/ios-codex-probe.sh', 'ios/NativeCodex/bridge/**', 'ios/NativeCodex/javascript/**', 'ios/NativeCodex/native-static-libs.txt') }}
      - name: Verify explicitly supplied execution-test results
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ inputs.runtime_proof_run }}
        run: python3 .github/scripts/ios-runtime-proof.py

  javascript-runtime-tests:
    needs: native-cache
    if: ${{ needs.native-cache.outputs.compiled != 'true' && needs.native-cache.outputs.runtime-verified != 'true' }}
    uses: ./.github/workflows/ios-code-mode-probe.yml

  build-native-app:
    needs: [native-cache, javascript-runtime-tests]
    if: ${{ always() && !cancelled() && needs.native-cache.result == 'success' && (needs.javascript-runtime-tests.result == 'success' || needs.javascript-runtime-tests.result == 'skipped') }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore native Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ios-codex-170-minimal-${{ runner.arch }}-device-${{ inputs.fast && 'dev0' || 'dev1' }}-build-${{ hashFiles('.github/scripts/prepare-ios-codex.py', '.github/scripts/ios-codex-probe.sh', 'ios/NativeCodex/bridge/**', 'ios/NativeCodex/javascript/**', 'ios/NativeCodex/native-static-libs.txt') }}
          restore-keys: ios-codex-170-minimal-${{ runner.arch }}-
      - name: Build the embedded official Codex library
        id: native-engine
        env:
          CODEX_PROBE_COMPONENT: bridge
          CODEX_PROBE_OPERATION: build
          CODEX_NATIVE_OPT_LEVEL: ${{ inputs.fast && '0' || '1' }}
          CODEX_REUSE_COMPILED_LIBRARY: ${{ steps.rust-cache.outputs.cache-hit }}
          CODEX_NATIVE_CACHE_KEY: ${{ steps.rust-cache.outputs.cache-primary-key }}
        run: bash .github/scripts/ios-codex-probe.sh
      - name: Test Swift authentication transport and chat integration
        if: ${{ !inputs.fast }}
        run: swift test --package-path ios/YoungminKit
      - name: Build native-login IPA
        env:
          YOUNGMIN_USE_NATIVE_CODEX: '1'
        run: bash .github/scripts/ios-device-ipa.sh
      - name: Prepare one iPad installation file
        run: cp ios-device-output/Youngmin-unsigned.ipa ios-device-output/Youngmin-iPad-test.ipa
      - name: Upload iPad test IPA directly
        uses: actions/upload-artifact@v7
        with:
          path: ios-device-output/Youngmin-iPad-test.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-codex-logs-${{ github.run_attempt }}
          path: |
            ios-codex-probe/*.log
            ios-codex-probe/*.txt
            ios-device-output/*.log
            ios-device-output/*.json
          retention-days: 7
      - name: Save native compilation cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios-codex-probe/source/codex-rs/target
          key: ${{ steps.native-engine.outcome == 'success' && steps.rust-cache.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.rust-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}
