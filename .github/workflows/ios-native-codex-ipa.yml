name: iOS Native Codex IPA

on:
  workflow_dispatch:
    inputs:
      fast:
        description: 빠른 iPad 설치 테스트용 빌드
        type: boolean
        default: true
      runtime_proof_run:
        description: 동일 실행기 코드의 검증을 이미 통과한 실행 번호 (선택)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-native-codex-ipa-${{ inputs.fast && 'test' || 'optimized' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cache:
    runs-on: macos-26-intel
    timeout-minutes: 5
    outputs:
      compiled: ${{ steps.lookup.outputs.hit }}
      runtime-verified: ${{ steps.proof.outputs.verified }}
      runtime-pending: ${{ steps.proof.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check whether this exact engine was already tested and built
        id: lookup
        continue-on-error: true
        uses: ./.github/actions/ios-codex-lib
        with:
          profile: ${{ inputs.fast && 'fast' || 'release' }}
          lookup-only: 'true'
      - name: Verify explicitly supplied execution-test results
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ inputs.runtime_proof_run }}
          PROOF_ALLOW_PENDING: '1'
        run: python3 .github/scripts/ios-runtime-proof.py

  javascript-runtime-tests:
    needs: native-cache
    if: ${{ needs.native-cache.outputs.compiled != 'true' && needs.native-cache.outputs.runtime-verified != 'true' && needs.native-cache.outputs.runtime-pending != 'true' }}
    uses: ./.github/workflows/ios-code-mode-probe.yml

  build-native-app:
    needs: [native-cache, javascript-runtime-tests]
    if: ${{ always() && !cancelled() && needs.native-cache.result == 'success' && (needs.javascript-runtime-tests.result == 'success' || needs.javascript-runtime-tests.result == 'skipped') }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the exact native library or the shared compilation cache
        id: native-lib
        uses: ./.github/actions/ios-codex-lib
        with:
          profile: ${{ inputs.fast && 'fast' || 'release' }}
      - name: Build the embedded official Codex library
        id: native-engine
        if: steps.native-lib.outputs.hit != 'true'
        run: python3 .github/scripts/ios-codex-lib.py build --profile '${{ inputs.fast && 'fast' || 'release' }}' --key '${{ steps.native-lib.outputs.key }}'
      - name: Test Swift authentication transport and chat integration
        if: ${{ !inputs.fast }}
        run: swift test --package-path ios/YoungminKit
      - name: Build native-login IPA
        env:
          YOUNGMIN_USE_NATIVE_CODEX: '1'
          YOUNGMIN_CONFIGURATION: Release
        run: bash .github/scripts/ios-device-ipa.sh
      - name: Prepare one iPad installation file
        run: cp ios-device-output/Youngmin-unsigned.ipa ios-device-output/Youngmin-iPad-test.ipa
      - name: Require successful execution proof before publishing the IPA
        id: runtime-proof
        if: ${{ needs.native-cache.outputs.runtime-pending == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ inputs.runtime_proof_run }}
          PROOF_WAIT_SECONDS: '1800'
        run: python3 .github/scripts/ios-runtime-proof.py
      - name: Upload iPad test IPA directly
        uses: actions/upload-artifact@v7
        with:
          path: ios-device-output/Youngmin-iPad-test.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-codex-logs-${{ github.run_attempt }}
          path: |
            ios-codex-probe/*.log
            ios-codex-probe/*.txt
            ios-device-output/*.log
            ios-device-output/*.json
          retention-days: 7
      - name: Save native library and compilation caches
        if: always() && steps.native-lib.outcome == 'success' && steps.native-lib.outputs.hit != 'true'
        uses: ./.github/actions/ios-codex-lib/save
        with:
          key: ${{ steps.native-lib.outputs.key }}
          build-key: ${{ steps.native-lib.outputs.build-key }}
          build-hit: ${{ steps.native-lib.outputs.build-hit }}
          compiled: ${{ steps.native-engine.outcome == 'success' }}
          # Only a library whose execution tests passed may let later runs skip them.
          publish-library: ${{ needs.javascript-runtime-tests.result == 'success' || needs.native-cache.outputs.runtime-verified == 'true' || (needs.native-cache.outputs.runtime-pending == 'true' && steps.runtime-proof.outcome == 'success') }}
