name: iOS JavaScript Tool Probe

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript-tool-probe:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check native JavaScript tool callbacks on macOS
        run: |
          set -o pipefail
          mkdir -p ios-javascript-probe
          swiftc -swift-version 5 ios/NativeCodex/JavaScriptCoreProbe.swift -o ios-javascript-probe/macos-probe
          ios-javascript-probe/macos-probe | tee ios-javascript-probe/macos.log
      - name: Install the Rust test toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-apple-ios
      - name: Test JavaScript execution and cancellation on macOS
        run: |
          set -o pipefail
          cargo +1.95.0 test --locked --manifest-path ios/NativeCodex/javascript/Cargo.toml -- --test-threads=1 2>&1 | tee ios-javascript-probe/rust-macos.log
      - name: Check the same callbacks inside iOS Simulator
        run: |
          set -o pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swiftc -swift-version 5 -sdk "$sdk" -target x86_64-apple-ios17.0-simulator ios/NativeCodex/JavaScriptCoreProbe.swift -o ios-javascript-probe/ios-probe
          simulator="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for k,v in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for d in v if d.get("isAvailable") and d["name"].startswith("iPhone")))')"
          printf '%s\n' "$simulator" > ios-javascript-probe/simulator-id
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl spawn "$simulator" "$PWD/ios-javascript-probe/ios-probe" | tee ios-javascript-probe/ios.log
      - name: Test JavaScript execution and cancellation inside iOS Simulator
        run: |
          set -o pipefail
          cat > ios-javascript-probe/runner.sh <<'SH'
          #!/bin/bash
          exec xcrun simctl spawn "$JSC_PROBE_SIMULATOR" "$@"
          SH
          chmod +x ios-javascript-probe/runner.sh
          export JSC_PROBE_SIMULATOR="$(cat ios-javascript-probe/simulator-id)"
          export CARGO_TARGET_X86_64_APPLE_IOS_RUNNER="$PWD/ios-javascript-probe/runner.sh"
          export SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          cargo +1.95.0 test --locked --manifest-path ios/NativeCodex/javascript/Cargo.toml --target x86_64-apple-ios -- --test-threads=1 2>&1 | tee ios-javascript-probe/rust-ios.log
      - name: Shut down the simulator
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [[ -f ios-javascript-probe/simulator-id ]]; then
            xcrun simctl shutdown "$(cat ios-javascript-probe/simulator-id)"
          fi
      - name: Upload probe logs
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: ios-javascript-tool-probe
          path: ios-javascript-probe/*.log

  codex-code-mode-delegate:
    needs: javascript-tool-probe
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the real Codex session and tool delegate contract
        env:
          CODEX_PROBE_COMPONENT: bridge
          CODEX_PROBE_OPERATION: code-mode-test
        run: bash .github/scripts/ios-codex-probe.sh
      - name: Upload Codex delegate diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: ios-code-mode-delegate-logs
          path: |
            ios-codex-probe/*.log
            ios-codex-probe/*.txt
